<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
</head>
<style>
    body {
        background-color: #383954;
    }
    #board {
    display: grid;
    grid-template-columns: repeat(8, 100px);
    width: 800px;
    margin: auto;
    margin-top: 100px;
}

p {
    text-align: center;
    font-size: 100px;
    color: white;
}

#board div {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    cursor: pointer;
}
</style>
<body>
    <p>Chess</p>
    <div id="board">

    </div>
    <script>
    const pieces = {
    'white': { 'king': '♔', 'queen': '♕', 'rook': '♖', 'bishop': '♗', 'knight': '♘', 'pawn': '♙' },
    'black': { 'king': '♚', 'queen': '♛', 'rook': '♜', 'bishop': '♝', 'knight': '♞', 'pawn': '♟' }
};
   let selectedSquare = null;
    function renderBoard(state) {
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let i = 0; i < state.board.length; i++) {
            for (let a = 0; a < state.board[i].length; a++) {
                div = document.createElement("div");
                if ((i + a) % 2 == 0) {
                    div.style.backgroundColor = "#fbc273";
                } else {
                    div.style.backgroundColor = "#95533b";
                }
                if ( state.board[i][a] != null) {
                    const piece = state.board[i][a];
                    if (piece.color === "black") {
                        div.textContent = pieces["black"][piece.name];
                    } else {
                        div.textContent = pieces["white"][piece.name];
                    }
                }
                board.appendChild(div)
                const row = i;
                const col = a;
                div.addEventListener('click', () => {
                    if (selectedSquare === null) {
                        selectedSquare = [row, col];
                    } else {
                        fetch('/move', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ from_square: selectedSquare, to_square: [row, col] })
                        })
                        .then(r => r.json())
                        .then(state => {
                            renderBoard(state);
                            selectedSquare = null;
                            if (!state.game_over) {
                                return fetch('/engine-move', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' }
                                })
                                .then(r => r.json())
                                .then(engineState => renderBoard(engineState));
                            }
                        });
                    }
                });
            }
        }
}
    fetch('/state')
        .then(r => r.json())
        .then(state => renderBoard(state));
    </script>
</body>
</html>
