<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
</head>
<style>
    #board {
    display: grid;
    grid-template-columns: repeat(8, 100px);
    width: 800px;
    margin: auto;
    margin-top: 100px;
}

p {
    text-align: center;
    font-size: 100px;
}

#board div {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    cursor: pointer;
}
</style>
<body>
    <p>Chess</p>
    <div id="board">

    </div>
    <script>
    function renderBoard(state) {
        const board = document.getElementById('board');
        board.innerHTML = '';
        for (let i = 0; i < state.board.length; i++) {
            for (let a = 0; a < state.board[i].length; a++) {
                div = document.createElement("div");
                if ((i + a) % 2 == 0) {
                    div.style.backgroundColor = "#fbc273";
                } else {
                    div.style.backgroundColor = "#95533b";
                }
                if ( state.board[i][a] != null) {
                    const piece = state.board[i][a];
                    if (piece.color === "black") {
                        div.textContent = piece.name === 'knight' ? 'n' : piece.name[0];
                    } else {
                        div.textContent = piece.name === 'knight' ? 'N' : piece.name[0].toUpperCase();
                    }
                }
                board.appendChild(div)
            }
        }
}
    fetch('/state')
        .then(r => r.json())
        .then(state => renderBoard(state));
    </script>
</body>
</html>
